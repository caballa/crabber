<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrabIR Playground</title>
<style>
  :root { color-scheme: light dark; --fg: #24292f; --muted: #6e7781; --border:#8884;
          --card:#ffffff; --inv-bg:#fff8e1; --inv-fg:#7a5c00; --edge:#8899a6;
          --inv-bg2:#e7f0ff; --inv-fg2:#0a3b7a;
          /* Post-invariants get their own colour: with several domains the
             entry rows already alternate between the two above. */
          --post-bg:#e6f6ec; --post-fg:#11633a;
          /* assertion outcomes: proved / not proved / fails */
          --ok-bg:#e6f6ec;   --ok-fg:#11633a;
          --warn-bg:#fff4e0; --warn-fg:#8a5300;
          --bad-bg:#ffebe9;  --bad-fg:#a40e26;
          /* Region fills, one per compared domain. Validated for both themes
             against the card surface; the second also gets a dashed outline, so
             which domain is which never rests on colour alone. */
          --series-1:#2a78d6; --series-2:#eb6834;
          /* token colours (light) */
          --t-comment:#6e7781; --t-keyword:#cf222e; --t-func:#8250df;
          --t-const:#0550ae;  --t-number:#0550ae;  --t-string:#0a3069;
          --t-type:#953800;   --t-var:#953800;      --t-label:#116329;
          --t-op:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --inv-bg:#2b2415; --inv-fg:#e3b341; --edge:#6b7681;
            --inv-bg2:#16233a; --inv-fg2:#79c0ff;
            --post-bg:#12261a; --post-fg:#7ee2a8;
            --ok-bg:#12261a;   --ok-fg:#7ee2a8;
            --warn-bg:#2b2415; --warn-fg:#e3b341;
            --bad-bg:#2d1618;  --bad-fg:#ff9492;
            /* The same two hues re-stepped for the dark surface, not flipped. */
            --series-1:#3987e5; --series-2:#d95926;
            --t-comment:#8b949e; --t-keyword:#ff7b72; --t-func:#d2a8ff;
            --t-const:#79c0ff;  --t-number:#79c0ff;  --t-string:#a5d6ff;
            --t-type:#ffa657;   --t-var:#ffa657;      --t-label:#7ee787;
            --t-op:#ff7b72; }
  }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; height: 100vh; color: var(--fg);
         display: grid; grid-template-rows: auto auto 1fr; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex;
           gap: 8px; align-items: center; flex-wrap: wrap; }
  header .spacer { flex: 1; }
  header a { color: var(--muted); }
  #hint { padding: 4px 12px; border-bottom: 1px solid var(--border); color: var(--muted);
          font-size: 12px; background: #8881; }
  #hint code { font-family: ui-monospace, monospace; }
  main { display: grid; grid-template-columns: var(--split-x, 1fr) 6px 1fr; min-height: 0; }
  .editor { position: relative; min-height: 0; overflow: hidden; }
  /* Draggable divider between the editor and the output pane. */
  .gutter { position: relative; background: var(--border); cursor: col-resize;
            z-index: 5; touch-action: none; }
  .gutter::before { content: ""; position: absolute; inset: -3px 0; }  /* wider hit area */
  .gutter::after { content: ""; position: absolute; left: 50%; top: 50%;
                   width: 2px; height: 24px; transform: translate(-50%, -50%);
                   border-radius: 2px; background: var(--muted); opacity: .5; }
  .gutter:hover::after, .gutter.dragging::after { opacity: 1; }
  .gutter:focus-visible { outline: 2px solid var(--t-func); outline-offset: -2px; }
  body.gutter-dragging { cursor: col-resize; user-select: none; }
  body.gutter-dragging.vert { cursor: row-resize; }
  /* The highlight layer and the textarea must share identical text metrics so
     the (transparent) textarea text lines up exactly over the coloured copy. */
  .editor > .hl, .editor > textarea {
    position: absolute; inset: 0; margin: 0; border: 0; padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    line-height: 1.5; tab-size: 2; box-sizing: border-box; overflow: auto;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
  }
  .editor > .hl { z-index: 0; pointer-events: none; color: var(--fg); background: transparent; }
  .editor > textarea { z-index: 1; background: transparent; color: transparent;
                       caret-color: var(--fg); resize: none; outline: none; }
  /* Right-hand pane: a tab bar over either the text output or the CFG graph. */
  .pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); align-items: center; }
  .tabs button { background: transparent; border: 1px solid transparent; border-radius: 6px;
                 padding: 2px 10px; color: var(--muted); }
  .tabs button.active { color: var(--fg); border-color: var(--border); background: #8881; }
  .tabs .note { color: var(--muted); font-size: 12px; margin-left: auto; }
  pre#out { margin: 0; padding: 10px; font-family: ui-monospace, monospace; font-size: 13px;
            min-height: 0; box-sizing: border-box; overflow: auto; white-space: pre-wrap; background: #8881; }
  #graph { min-height: 0; overflow: auto; padding: 12px; background: #8881; }
  #graph[hidden], #out[hidden] { display: none; }
  /* A block and its region sit side by side; which side is chosen per block so
     that expanding one pushes away from the graph's centre line. */
  .node-slot { display: flex; align-items: flex-start; gap: 10px; }
  .node-shape[hidden] { display: none; }
  /* Reads as an action, not a caption: it is the one control on a block card,
     and at muted 10px it went unnoticed. */
  .shape-toggle { display: flex; align-items: center; gap: 6px; width: 100%;
                  margin: 0; padding: 5px 8px; background: #8881; border: 0;
                  border-top: 1px solid var(--border); color: var(--series-1);
                  cursor: pointer; text-align: left; font: 600 11px system-ui; }
  .shape-toggle:hover { background: #8882; text-decoration: underline; }
  .shape-toggle:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
  .shape-toggle svg { flex: none; }
  .sh-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            margin-bottom: 10px; font-size: 12px; }
  .sh-ctl select, #sh-pick select { font-size: 12px; }
  #sh-pick { display: flex; gap: 8px; align-items: center; font-size: 12px;
             color: var(--muted); margin-left: 12px; }
  #sh-pick[hidden] { display: none; }
  .sh-plot { background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .sh-legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 0; font-size: 12px; }
  .sh-key { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
            margin-right: 5px; vertical-align: -1px; }
  .sh-note { color: var(--muted); font-size: 12px; margin-top: 8px; max-width: 60ch; }
  .sh-note strong { color: var(--warn-fg); font-weight: 600; }
  .sh-axis { stroke: var(--muted); stroke-width: 1; opacity: .6; }
  .sh-grid { stroke: var(--border); stroke-width: .5; opacity: .5; }
  .sh-tick { fill: var(--muted); font: 10px ui-monospace, monospace; }
  .sh-vlabel { fill: var(--fg); font: 600 11px system-ui; }
  .sh-lattice { fill: var(--muted); opacity: .45; }
  .cfg-title { font: 600 13px system-ui; margin: 2px 0 10px; }
  .cfg-canvas { position: relative; width: max-content; min-width: 100%; margin: 0 auto 24px; }
  .layers { position: relative; z-index: 1; display: flex; flex-direction: column;
            gap: 40px; align-items: center; width: max-content; margin: 0 auto; }
  .layer { display: flex; gap: 30px; justify-content: center; }
  .node { border: 1px solid var(--border); border-radius: 8px; background: var(--card);
          min-width: 130px; max-width: 300px; box-shadow: 0 1px 3px #0003; overflow: hidden; }
  .node h4 { margin: 0; padding: 4px 8px; border-bottom: 1px solid var(--border);
             font: 600 12px ui-monospace, monospace; color: var(--t-label); }
  .node .insts { padding: 4px 8px; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  /* A checked statement is tinted and badged; everything else reads as before. */
  .node .inst { display: block; }
  .node .inst.chk-safe, .node .inst.chk-warn, .node .inst.chk-error {
    margin: 1px -8px; padding: 1px 8px 1px 4px; border-left: 3px solid transparent; }
  .node .inst.chk-safe  { background: var(--ok-bg);   border-left-color: var(--ok-fg); }
  .node .inst.chk-warn  { background: var(--warn-bg); border-left-color: var(--warn-fg); }
  .node .inst.chk-error { background: var(--bad-bg);  border-left-color: var(--bad-fg); }
  .chk-badge { display: inline-block; width: 1.1em; font-weight: 700; text-align: center; }
  .chk-safe  > .chk-badge { color: var(--ok-fg); }
  .chk-warn  > .chk-badge { color: var(--warn-fg); }
  .chk-error > .chk-badge { color: var(--bad-fg); }
  .cfg-tally { margin-left: 8px; padding: 1px 6px; border-radius: 10px;
               font: 600 11px system-ui; vertical-align: 1px; }
  .cfg-tally.chk-safe  { background: var(--ok-bg);   color: var(--ok-fg); }
  .cfg-tally.chk-warn  { background: var(--warn-bg); color: var(--warn-fg); }
  .cfg-tally.chk-error { background: var(--bad-bg);  color: var(--bad-fg); }
  .node .inv { padding: 3px 8px; border-bottom: 1px solid var(--border); font: 12px/1.4 ui-monospace, monospace;
               background: var(--inv-bg); color: var(--inv-fg); white-space: pre-wrap; word-break: break-word; }
  .node .inv.inv-b { background: var(--inv-bg2); color: var(--inv-fg2); }
  /* Sits below the instructions, so it is separated from them at the top. */
  .node .inv.inv-post { background: var(--post-bg); color: var(--post-fg);
                        border-bottom: 0; border-top: 1px solid var(--border); }
  .node .inv-tag { display: inline-block; margin-right: 6px; font: 600 9px/1.4 system-ui;
                   letter-spacing: .04em; text-transform: uppercase; opacity: .65; vertical-align: 1px; }
  .node .inv-text { display: block; }
  .node .inv-text.clamped { max-height: 5.6em; overflow: hidden;
                            -webkit-mask-image: linear-gradient(#000 70%, transparent);
                            mask-image: linear-gradient(#000 70%, transparent); }
  .node .inv-toggle { display: block; margin-top: 2px; padding: 0; background: transparent;
                      border: 0; color: inherit; opacity: .7; cursor: pointer;
                      font: 600 10px system-ui; }
  .node .inv-toggle:hover { opacity: 1; text-decoration: underline; }
  svg.edges { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
  svg.edges path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  /* On narrow screens stack the editor above the output instead of side-by-side. */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: var(--split-y, 1fr) 6px 1fr; }
    .gutter { cursor: row-resize; }
    .gutter::before { inset: 0 -3px; }
    .gutter::after { width: 24px; height: 2px; }
  }
  /* token colours */
  .t-comment{color:var(--t-comment);font-style:italic} .t-keyword{color:var(--t-keyword)}
  .t-func{color:var(--t-func)} .t-const{color:var(--t-const)} .t-number{color:var(--t-number)}
  .t-string{color:var(--t-string)} .t-type{color:var(--t-type)} .t-var{color:var(--t-var)}
  .t-label{color:var(--t-label);font-weight:600} .t-op{color:var(--t-op)}
</style>
</head>
<body>
<header>
  <strong>CrabIR Playground</strong>
  <label>Example
    <select id="examples"><option value="">— load a test —</option></select>
  </label>
  <label>Domain
    <select id="domain">
      <option value="int">intervals</option>
      <option value="dis-int">dis-intervals</option>
      <option value="int-terms">int + terms</option>
      <option value="int-set">powerset intervals</option>
      <option value="int-val-part">val-part intervals</option>
      <option value="zones">zones</option>
      <option value="zones-val-part">val-part zones</option>
      <option value="tvpi-dbm">template DBM</option>
      <option value="oct-snf">octagons (snf)</option>
      <option value="oct">octagons (apron)</option>
      <option value="pk">polyhedra (apron)</option>
    </select>
  </label>
  <label>Compare with
    <select id="domain2">
      <option value="">— none —</option>
      <option value="int">intervals</option>
      <option value="dis-int">dis-intervals</option>
      <option value="int-terms">int + terms</option>
      <option value="int-set">powerset intervals</option>
      <option value="int-val-part">val-part intervals</option>
      <option value="zones">zones</option>
      <option value="zones-val-part">val-part zones</option>
      <option value="tvpi-dbm">template DBM</option>
      <option value="oct-snf">octagons (snf)</option>
      <option value="oct">octagons (apron)</option>
      <option value="pk">polyhedra (apron)</option>
    </select>
  </label>
  <label>Flags <input id="flags" type="text" size="22" placeholder="e.g. --widening-delay 10" spellcheck="false"></label>
  <label><input type="checkbox" id="inv" checked> invariants</label>
  <button id="run" disabled>Loading…</button>
  <button id="share" title="Copy a link that restores this program, domain and flags">Share</button>
  <span class="spacer"></span>
  <a href="https://github.com/caballa/crabber#writing-crabir-programs" target="_blank" rel="noopener">Syntax reference ↗</a>
</header>
<div id="hint"></div>
<main>
  <div class="editor">
    <pre class="hl" id="hl" aria-hidden="true"></pre>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </div>
  <div class="gutter" id="gutter" role="separator" aria-orientation="vertical"
       title="Drag to resize" tabindex="0" aria-label="Resize editor and output panes"></div>
  <div class="pane">
    <div class="tabs">
      <button id="tab-text" data-view="text">Text</button>
      <button id="tab-graph" class="active" data-view="graph">Graph</button>
      <span id="sh-pick" hidden></span>
      <span class="note">CFG blocks with their invariants on entry, and on exit for the exit block</span>
    </div>
    <pre id="out" hidden></pre>
    <div id="graph"></div>
  </div>
</main>
<script src="examples.js"></script>
<script src="geometry.js"></script>
<script src="crabber.js"></script>
<script>
const example = `procedure("foo")
  start:
   x := 0
   goto loop
  loop:
   x := x + 1
   if (x <= 9) goto loop else goto out
  out:
   EXPECT_EQ(true, assert(x == 10))
`;
const $ = id => document.getElementById(id);
const src = $('src'), hl = $('hl');

/* ---- One-line description shown for the selected abstract domain ---- */
const DOMAIN_DESC = {
  'int':           'Intervals: bounds each variable independently (x ∈ [lo, hi]). Fast, non-relational.',
  'dis-int':       'Disjunctive intervals: a union of intervals per variable (handles gaps).',
  'int-terms':     'Intervals + symbolic terms: also tracks equalities between expressions.',
  'int-set':       'Powerset of intervals: keeps a set of interval states (disjunctions).',
  'int-val-part':  'Value-partitioned intervals: splits the analysis on the values of a chosen variable.',
  'zones':         'Zones (DBM): relational, tracks x − y ≤ c. Good precision/cost balance.',
  'zones-val-part':'Value-partitioned zones.',
  'tvpi-dbm':      'Template DBM: difference constraints a·x − b·y ≤ c over the --coefficients you pass. Zones ⊂ tDBM ⊂ TVPI.',
  'oct-snf':       'Octagons: relational, tracks ±x ± y ≤ c.',
  'oct':           'Octagons via Apron (exact/MPQ): tracks ±x ± y ≤ c.',
  'pk':            'Convex polyhedra via Apron (exact/MPQ): tracks arbitrary linear inequalities Σ aᵢ·xᵢ ≤ c. Most precise linear domain, most expensive.',
};
// Short display name per domain value (from the Domain dropdown), used to
// label each domain's invariants when comparing.
const DOMAIN_LABEL = {};
for (const o of $('domain').options) DOMAIN_LABEL[o.value] = o.textContent.trim();
function updateHint() {
  const d = $('domain').value;
  $('hint').innerHTML = (DOMAIN_DESC[d] || '') +
    '  ·  Run with <code>Ctrl/Cmd+Enter</code>. Your program is saved in this browser.';
}

/* ---- Syntax highlighting (token rules mirror what the crabber parser accepts) ---- */
const RULES = [
  ['comment', /#[^\n]*/],
  ['string',  /"(?:\\.|[^"\\])*"/],
  ['type',    /(?<=:)\s*(?:int|bool)\b/],
  ['keyword', /\b(?:in|out)\b(?=\s+[-A-Za-z$._][-A-Za-z$._0-9]*\s*:)/],
  ['func',    /\bEXPECT_[A-Z_]+\b/],
  ['func',    /\b(?:value_partition_start|value_partition_end)\b/],
  ['keyword', /\b(?:array_store|array_load)\b/],
  ['keyword', /\b(?:bool_to_int)\b/],
  ['keyword', /\b(?:if|else|goto|assume|assert|havoc|call|exit)\b/],
  ['keyword', /\b(?:and|or|xor|not)\b/],
  ['keyword', /\bprocedure\b/],
  ['const',   /\b(?:true|false)\b/],
  ['var',     /@[-A-Za-z$._][-A-Za-z$._0-9]*/],
  ['number',  /-?[0-9]+/],
  ['op',      /:=|<=|>=|==|!=|<|>|\+|-|\*|\//],
];
const COMBINED = new RegExp(RULES.map(r => '(' + r[1].source + ')').join('|'), 'g');
const LABEL = /^(\s*)([-A-Za-z$._0-9]+)(\s*)(:)(\s*)(?=#|$)/;
const esc = s => s.replace(/[&<>]/g, c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;');

function tokenizeInline(s) {
  let out = '', last = 0, m;
  COMBINED.lastIndex = 0;
  while ((m = COMBINED.exec(s))) {
    if (m.index > last) out += esc(s.slice(last, m.index));
    let cls = 'op';
    for (let i = 1; i < m.length; i++) if (m[i] !== undefined) { cls = RULES[i - 1][0]; break; }
    out += '<span class="t-' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
    if (m[0].length === 0) COMBINED.lastIndex++;
  }
  if (last < s.length) out += esc(s.slice(last));
  return out;
}
function highlight(text) {
  return text.split('\n').map(line => {
    const lm = LABEL.exec(line);
    if (lm) {
      return esc(lm[1]) + '<span class="t-label">' + esc(lm[2]) + '</span>' +
             esc(lm[3]) + '<span class="t-label">' + esc(lm[4]) + '</span>' +
             esc(lm[5]) + tokenizeInline(line.slice(lm[0].length));
    }
    return tokenizeInline(line);
  }).join('\n') + '\n';
}
function sync() {
  hl.innerHTML = highlight(src.value);
  hl.scrollTop = src.scrollTop; hl.scrollLeft = src.scrollLeft;
}

/* ---- Persisted state: URL hash (shareable) and localStorage (autosave) ----
   State is { c: code, d: domain, f: flags, i: invariants-checkbox }.
   Precedence on load: URL hash > localStorage > built-in example. */
const LS_KEY = 'crabir-playground';
const b64e = s => btoa(unescape(encodeURIComponent(s)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(
                    s.replace(/-/g, '+').replace(/_/g, '/'))));
function currentState() {
  return { c: src.value, d: $('domain').value, d2: $('domain2').value,
           f: $('flags').value, i: $('inv').checked };
}
function applyState(st) {
  if (typeof st.c === 'string') src.value = st.c;
  if (st.d) $('domain').value = st.d;
  $('domain2').value = st.d2 || '';
  $('flags').value = st.f || '';
  if ('i' in st) $('inv').checked = !!st.i;
  sync(); updateHint();
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(currentState())); } catch (e) {}
}
function loadInitialState() {
  const h = location.hash.slice(1);
  if (h) { try { applyState(JSON.parse(b64d(h))); return; } catch (e) {} }
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) { applyState(JSON.parse(s)); return; }
  } catch (e) {}
  src.value = example; sync(); updateHint();
}

/* ---- Wire up the editor ---- */
src.addEventListener('input', () => { sync(); save(); });
src.addEventListener('scroll', () => { hl.scrollTop = src.scrollTop; hl.scrollLeft = src.scrollLeft; });
src.addEventListener('keydown', e => {
  if (e.key === 'Tab') {                           // Tab inserts two spaces instead of leaving the field
    e.preventDefault(); const a = src.selectionStart, b = src.selectionEnd;
    src.setRangeText('  ', a, b, 'end'); sync(); save();
  } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); $('run').click();          // Ctrl/Cmd+Enter runs the analyzer
  }
});
$('domain').addEventListener('change', () => { updateHint(); save(); });
$('domain2').addEventListener('change', save);
$('flags').addEventListener('input', save);
$('inv').addEventListener('change', save);

/* ---- Examples: the CrabIR programs from the CTest suite (examples.js) ---- */
const examplesSel = $('examples');
for (const ex of (window.CRABIR_EXAMPLES || [])) {
  const o = document.createElement('option');
  o.value = ex.name; o.textContent = ex.name;
  examplesSel.appendChild(o);
}
examplesSel.addEventListener('change', () => {
  const ex = (window.CRABIR_EXAMPLES || []).find(e => e.name === examplesSel.value);
  if (!ex) return;
  applyState({ c: ex.code, d: ex.domain, f: ex.flags || '', i: $('inv').checked });
  $('out').textContent = '';
  save();
});

/* ---- Share: put the current state in the URL and copy it to the clipboard ---- */
const shareBtn = $('share');
shareBtn.addEventListener('click', async () => {
  location.hash = b64e(JSON.stringify(currentState()));
  const label = shareBtn.textContent;
  try {
    await navigator.clipboard.writeText(location.href);
    shareBtn.textContent = 'Copied!';
  } catch (e) {
    shareBtn.textContent = 'Link in URL bar';
  }
  setTimeout(() => { shareBtn.textContent = label; }, 1500);
});

/* ================= CFG + invariants graph ================= */

/* ---- Assertion outcomes ----
   crabber already records them in the dot: the checker's verdict is emitted as
   a comment line immediately before the statement it is about, e.g.

     //// File:no-filename line:10 col:0 Result:  FAIL -- num of warnings=1
     assert(-x <= -100)   /* loc(file=no-filename line=10 col=0) id=1 *\/

   so no extra run is needed -- the verdict just has to be moved off its own
   line and onto the statement, where it can be read at a glance. */
const RE_CHECK = /^\/\/\/\/\s*File:.*?Result:\s*(.+)$/;
const RE_LOC = /\s*\/\*\s*loc\([^)]*\)[^*]*\*\/\s*/g;

/* Crab distinguishes a proof from a failure to prove, and the difference is the
   whole point of reading these: a warning means the analysis could not show the
   assertion holds, not that it is false. */
const CHECK_INFO = {
  safe:  { glyph: '✓', label: 'proved',
           title: 'Proved: the assertion holds on every path the analysis admits' },
  warn:  { glyph: '?',      label: 'not proved',
           title: 'Not proved: this domain cannot show the assertion holds. ' +
                  'It may still be true -- try a more precise domain' },
  error: { glyph: '✗', label: 'fails',
           title: 'Fails: the analysis found the assertion violated' },
};

function classifyCheck(s) {
  if (/^OK\b/.test(s.trim())) return 'safe';
  if (/num of errors=[1-9]/.test(s)) return 'error';
  return 'warn';
}

/* Fold the verdict comments into the statements they describe, and drop the
   `/* loc(...) *\/` debug info, which is noise once the verdict is shown. */
function parseStmts(parts) {
  const out = [];
  let pending = null;
  for (const p of parts) {
    const cm = RE_CHECK.exec(p);
    if (cm) { pending = classifyCheck(cm[1]); continue; }
    out.push({ text: p.replace(RE_LOC, '').trim(), status: pending });
    pending = null;
  }
  return out;
}

/* Totals per CFG, for the one-line summary over each graph. */
function checkTally(g) {
  const t = { safe: 0, warn: 0, error: 0 };
  for (const id of Object.keys(g.blocks))
    for (const s of g.blocks[id].insts) if (s.status) t[s.status]++;
  return t;
}

/* Parse the Graphviz dot emitted by crabber's --print-invariants-to-dot into
   blocks, control-flow edges, per-block pre-invariants, and the post-invariant
   of the exit block. The dot is scanned as a whole (not line by line) because
   some invariant labels span several lines: the powerset domain prints
   "Inv1 or\nInv2 or\n..." and value partitioning prints a multi-line map.
   Label values never contain a literal double quote, so a non-greedy match up
   to the closing "] is safe. */
function parseDot(dot) {
  const blocks = {}, edges = [], inv = {}, invById = {}, post = {}, postById = {};
  let m;
  // Every invariant label opens with an "on ENTRY"/"on EXIT" line naming the
  // end of the block it holds at. The card shows that as a tag, so drop it
  // here -- the "\n" is the two characters dot wants, not a newline.
  const stripEnd = s => s.replace(/^on (?:ENTRY|EXIT)\\n/, '');
  const reBlock = /(Node0x[0-9a-f]+)\s*\[shape=record,label="\{([\s\S]*?)\}"\]/g;
  while (m = reBlock.exec(dot)) {
    const parts = m[2].split('\\l').map(s => s.trim()).filter(s => s.length);
    const name = (parts.shift() || '').replace(/:$/, '');
    blocks[m[1]] = { name, insts: parseStmts(parts) };
  }
  const reInv = /(NodePreInv0x[0-9a-f]+)\s*\[[^\]]*?label="([\s\S]*?)"\]/g;
  while (m = reInv.exec(dot)) invById[m[1]] = stripEnd(m[2]);
  const reInvEdge = /(NodePreInv0x[0-9a-f]+)\s*->\s*(Node0x[0-9a-f]+)/g;
  while (m = reInvEdge.exec(dot)) inv[m[2]] = invById[m[1]];
  // Only the exit block has a post-invariant, and its edge runs the other way:
  // out of the block, into the invariant.
  const rePost = /(NodePostInv0x[0-9a-f]+)\s*\[[^\]]*?label="([\s\S]*?)"\]/g;
  while (m = rePost.exec(dot)) postById[m[1]] = stripEnd(m[2]);
  const rePostEdge = /(Node0x[0-9a-f]+)\s*->\s*(NodePostInv0x[0-9a-f]+)/g;
  while (m = rePostEdge.exec(dot)) post[m[1]] = postById[m[2]];
  // Control-flow edges: Node -> Node. The invariant edges above have a
  // different prefix on one end or the other, so this pattern skips them.
  const reEdge = /(Node0x[0-9a-f]+)\s*->\s*(Node0x[0-9a-f]+)/g;
  while (m = reEdge.exec(dot)) edges.push([m[1], m[2]]);
  return { blocks, edges, inv, post };
}

/* Simplify the reduced-product pairs anywhere in a string: the analyzer prints
   "(bool, num)"; when the boolean part is empty ({}) keep only the numeric
   part, and collapse ({}, {}) to "top". Works on a single invariant and on the
   whole text dump, and also tidies the inner pairs of powerset disjuncts and
   the value-partitioning map. Applied on the playground only. */
function simplifyPairs(s) {
  return String(s)
    .replace(/\(\{\}\s*,\s*\{\}\)/g, 'top')          // ({}, {}) -> top
    .replace(/\(\{\}\s*,\s*(\{[^{}]*\})\)/g, '$1');   // ({}, {Y}) -> {Y}
}

/* Tidy a single invariant string for display in a graph card.
   The two extremes get spelled out: a bare "true"/"false" in a card says far
   less than naming what it means about the block. */
function prettyInv(s) {
  const out = simplifyPairs(String(s).trim());
  // "top" is what simplifyPairs leaves of a raw ({}, {}) -- the un-normalized
  // spelling, still seen with --no-normalize and on the dis-int fallback.
  if (out === '' || out === '{}' || out === 'true' || out === 'top')
    return '⊤ (no constraints)';
  if (out === 'false' || out === '_|_') return '⊥ (unreachable)';
  return out;
}

/* Assign each block to a layer (longest path from the entry over forward edges);
   edges that close a cycle are marked as back edges and drawn to the side. */
function layoutGraph(g) {
  const ids = Object.keys(g.blocks);
  const entry = ids.find(i => g.blocks[i].name === 'start') || ids[0];
  const state = {}, back = new Set(), order = [];
  function dfs(u) {
    state[u] = 1;
    for (const [a, b] of g.edges) if (a === u) {
      if (state[b] === 1) back.add(a + '>' + b);
      else if (!state[b]) dfs(b);
    }
    state[u] = 2; order.push(u);
  }
  if (entry) dfs(entry);
  ids.forEach(i => { if (!state[i]) dfs(i); });   // pick up any unreachable blocks
  const fwd = g.edges.filter(([a, b]) => !back.has(a + '>' + b));
  const layer = {}; ids.forEach(i => layer[i] = 0);
  for (const u of order.slice().reverse())        // topological order
    for (const [a, b] of fwd) if (a === u) layer[b] = Math.max(layer[b], layer[u] + 1);
  const maxL = Math.max(0, ...ids.map(i => layer[i]));
  const layers = [];
  for (let l = 0; l <= maxL; l++) layers.push(ids.filter(i => layer[i] === l));
  return { layers, layer };
}

const decodeEnt = s => s.replace(/&le;/g, '≤').replace(/&ge;/g, '≥')
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

// An invariant longer than this many lines or characters starts collapsed.
const COLLAPSE_LINES = 4, COLLAPSE_CHARS = 200;

// One row for one invariant, from a { label, text } entry.
function buildInvRow(iv, cls, title) {
  const row = document.createElement('div');
  row.className = cls;
  row.title = title + (iv.label ? ' — ' + iv.label : '');
  const tag = document.createElement('span');
  tag.className = 'inv-tag';
  tag.textContent = iv.label;
  row.appendChild(tag);
  const text = decodeEnt(prettyInv(iv.text));
  const lines = text.split('\n').length;
  // Large invariants (e.g. powerset disjunctions, value-partition maps) are
  // collapsed to a few lines with a toggle to expand them.
  if (lines > COLLAPSE_LINES || text.length > COLLAPSE_CHARS) {
    const box = document.createElement('div');
    box.className = 'inv-text clamped';
    box.textContent = text;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'inv-toggle';
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = '▸ show all (' + lines + ' lines)';
    row.appendChild(box);
    row.appendChild(btn);
  } else {
    row.appendChild(document.createTextNode(text));
  }
  return row;
}

// invList and postList are arrays of { label, text } — one entry per analyzed
// domain. Pre-invariants hold before the first statement, so they go at the top
// of the block; the post-invariant holds after the last one, so it goes at the
// bottom. Only the exit block has a post: for every other block it is already
// on the graph as the pre of its successors.
function buildNode(g, id, invList, postList) {
  const b = g.blocks[id];
  const el = document.createElement('div');
  el.className = 'node';
  const h = document.createElement('h4');
  h.textContent = b.name;
  el.appendChild(h);
  (invList || []).forEach((iv, idx) => {
    el.appendChild(buildInvRow(iv, 'inv' + (idx % 2 ? ' inv-b' : ''),
      'Invariant on entry to this block (before the first statement)'));
  });
  if (b.insts.length) {
    const body = document.createElement('div');
    body.className = 'insts';
    for (const s of b.insts) {
      const line = document.createElement('div');
      line.className = 'inst' + (s.status ? ' chk-' + s.status : '');
      if (s.status) {
        const info = CHECK_INFO[s.status];
        const badge = document.createElement('span');
        badge.className = 'chk-badge';
        badge.textContent = info.glyph;
        line.title = info.title;
        line.appendChild(badge);
      }
      line.appendChild(document.createTextNode(decodeEnt(s.text)));
      body.appendChild(line);
    }
    el.appendChild(body);
  }
  (postList || []).forEach(iv => {
    el.appendChild(buildInvRow(iv, 'inv inv-post',
      'Invariant on exit from this block (after the last statement)'));
  });
  // Collapsed by default: a plot per block would treble the graph's height and
  // bury the control flow, which is what the graph is for. The region is one
  // click away instead, and full size when it arrives.
  if (shapeCtx && shapeCtx.byLabel.has(b.name)) {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'shape-toggle';
    t.dataset.label = b.name;
    const open = shapeOpen.has(b.name);
    t.setAttribute('aria-expanded', String(open));
    // A picture of what the click produces -- a shaded region inside a pair of
    // axes -- so the control is findable without reading it.
    const icon = document.createElementNS(SVGNS, 'svg');
    icon.setAttribute('width', '12'); icon.setAttribute('height', '12');
    icon.setAttribute('viewBox', '0 0 12 12');
    icon.setAttribute('aria-hidden', 'true');
    const area = document.createElementNS(SVGNS, 'path');
    area.setAttribute('d', 'M2.5 10 H9.5 V5.5 L2.5 8.5 Z');
    area.setAttribute('fill', 'currentColor');
    area.setAttribute('fill-opacity', '.4');
    const axes = document.createElementNS(SVGNS, 'path');
    axes.setAttribute('d', 'M1.5 1 V10.5 H11');
    axes.setAttribute('fill', 'none');
    axes.setAttribute('stroke', 'currentColor');
    axes.setAttribute('stroke-width', '1.2');
    icon.appendChild(area); icon.appendChild(axes);
    t.appendChild(icon);
    const lbl = document.createElement('span');
    lbl.className = 'shape-label';
    lbl.textContent = shapeLabelText(open);
    t.appendChild(lbl);
    el.appendChild(t);
  }
  return el;
}

/* Names the action, and names the axes while collapsed so the pair does not
   have to be read off the tab bar. */
function shapeLabelText(open) {
  return open ? 'hide plot' : `plot ${shapeCtx.x} vs ${shapeCtx.y}`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function drawEdges(svg, canvas, nodeEl, g, layer) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);   // re-runnable after a toggle
  const cr = canvas.getBoundingClientRect();
  svg.setAttribute('width', canvas.offsetWidth);
  svg.setAttribute('height', canvas.offsetHeight);
  const defs = document.createElementNS(SVGNS, 'defs');
  defs.innerHTML = '<marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">' +
    '<path d="M0,0 L6,3 L0,6 z" fill="var(--edge)"/></marker>';
  svg.appendChild(defs);
  const at = (id, side) => {
    const r = nodeEl[id].getBoundingClientRect();
    if (side === 'right') return { x: r.right - cr.left, y: r.top + r.height / 2 - cr.top };
    return { x: r.left + r.width / 2 - cr.left, y: (side === 'top' ? r.top : r.bottom) - cr.top };
  };
  for (const [a, b] of g.edges) {
    if (!nodeEl[a] || !nodeEl[b]) continue;
    const p = document.createElementNS(SVGNS, 'path');
    let d;
    if (layer[b] > layer[a]) {                     // forward edge: top-to-bottom curve
      const s = at(a, 'bottom'), t = at(b, 'top');
      d = `M ${s.x} ${s.y} C ${s.x} ${s.y + 40}, ${t.x} ${t.y - 40}, ${t.x} ${t.y}`;
    } else {                                        // back/lateral edge: bow out to the right
      const s = at(a, 'right'), t = at(b, 'right');
      const dx = 50 + Math.abs(s.y - t.y) * 0.15;
      d = `M ${s.x} ${s.y} C ${s.x + dx} ${s.y}, ${t.x + dx} ${t.y}, ${t.x} ${t.y}`;
    }
    p.setAttribute('d', d);
    p.setAttribute('marker-end', 'url(#arw)');
    svg.appendChild(p);
  }
}

/* Merge the per-domain runs into one graph per cfg. The control-flow
   structure is identical across domains (it depends only on the program), so
   the first run supplies blocks and edges; every run contributes its own
   pre-invariant per block and its post-invariant for the exit block, matched by
   block name (the Node* pointer ids differ between runs). Each block ends up
   with `invs` and `posts` lists of { label, text }. */
function buildUnifiedGraphs(runs) {
  if (!runs.length || !runs[0].dots.length) return [];
  const single = runs.length === 1;
  const out = [];
  for (const { name, dot } of runs[0].dots) {
    const g = parseDot(dot);
    const invs = {}, posts = {};
    for (const id of Object.keys(g.blocks)) { invs[id] = []; posts[id] = []; }
    for (const run of runs) {
      const d = run.dots.find(x => x.name === name);
      if (!d) continue;
      const gr = parseDot(d.dot);
      const byName = {}, postByName = {};
      for (const [rid, rb] of Object.entries(gr.blocks)) {
        if (gr.inv[rid] != null) byName[rb.name] = gr.inv[rid];
        if (gr.post[rid] != null) postByName[rb.name] = gr.post[rid];
      }
      // With several domains the row already carries the domain name, so the
      // exit rows say which end they are for on top of that.
      const label = single ? 'on entry' : run.label;
      const postLabel = single ? 'on exit' : run.label + ' · on exit';
      for (const [id, b] of Object.entries(g.blocks)) {
        if (byName[b.name] != null) invs[id].push({ label, text: byName[b.name] });
        if (postByName[b.name] != null)
          posts[id].push({ label: postLabel, text: postByName[b.name] });
      }
    }
    out.push({ name, g, invs, posts });
  }
  return out;
}

function renderGraph(container, graphs) {
  container.innerHTML = '';
  if (!graphs || !graphs.length) {
    container.textContent = 'Run the analyzer to see the control-flow graph and invariants.';
    return;
  }
  for (const { name, g, invs, posts } of graphs) {
    const { layers, layer } = layoutGraph(g);
    const title = document.createElement('div');
    title.className = 'cfg-title';
    title.textContent = 'CFG: ' + name;
    // Whether the assertions came out is the first thing wanted from a run, so
    // it goes next to the name rather than only on the statements below.
    const t = checkTally(g);
    if (t.safe || t.warn || t.error) {
      for (const k of ['safe', 'warn', 'error']) {
        if (!t[k]) continue;
        const chip = document.createElement('span');
        chip.className = 'cfg-tally chk-' + k;
        chip.title = CHECK_INFO[k].title;
        chip.textContent = CHECK_INFO[k].glyph + ' ' + t[k] + ' ' +
                           CHECK_INFO[k].label;
        title.appendChild(chip);
      }
    }
    container.appendChild(title);

    const canvas = document.createElement('div');
    canvas.className = 'cfg-canvas';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'edges');
    const layersDiv = document.createElement('div');
    layersDiv.className = 'layers';
    const nodeEl = {};
    for (const lyr of layers) {
      const row = document.createElement('div');
      row.className = 'layer';
      lyr.forEach((id, i) => {
        const card = buildNode(g, id, invs[id], posts[id]);
        nodeEl[id] = card;                       // edges anchor to the card, not the slot
        const slot = document.createElement('div');
        slot.className = 'node-slot';
        const holder = document.createElement('div');
        holder.className = 'node-shape';
        holder.hidden = true;
        // Blocks left of their layer's centre open leftwards and the rest open
        // rightwards, so expanding one pushes away from the graph's centre line
        // instead of shoving the whole row sideways. A layer holding one block
        // has no left half, so it opens rightwards like anything else unpaired.
        if (i < (lyr.length - 1) / 2) { slot.appendChild(holder); slot.appendChild(card); }
        else { slot.appendChild(card); slot.appendChild(holder); }
        // Re-rendering (a new run, or a different pair of axes) keeps whatever
        // was open open: the axes are usually changed to look again at the block
        // already being looked at.
        if (shapeOpen.has(g.blocks[id].name) && shapeCtx) {
          holder.appendChild(shapePanel(g.blocks[id].name));
          holder.hidden = false;
        }
        row.appendChild(slot);
      });
      layersDiv.appendChild(row);
    }
    canvas.appendChild(svg);
    canvas.appendChild(layersDiv);
    container.appendChild(canvas);
    const redraw = () => drawEdges(svg, canvas, nodeEl, g, layer);
    redraw();                                        // measure after the DOM is laid out
    // Expand/collapse a large invariant, then re-route the edges since the
    // block (and everything below it) changed height.
    canvas.addEventListener('click', e => {
      const shape = e.target.closest('.shape-toggle');
      if (shape) {
        const holder = shape.closest('.node-slot').querySelector('.node-shape');
        if (!holder.children.length) holder.appendChild(shapePanel(shape.dataset.label));
        holder.hidden = !holder.hidden;
        if (holder.hidden) shapeOpen.delete(shape.dataset.label);
        else shapeOpen.add(shape.dataset.label);
        shape.setAttribute('aria-expanded', String(!holder.hidden));
        // Only the label: overwriting the button would take the icon with it.
        shape.querySelector('.shape-label').textContent = shapeLabelText(!holder.hidden);
        redraw();                                // the block moved; re-route the edges
        return;
      }
      const btn = e.target.closest('.inv-toggle');
      if (!btn) return;
      const box = btn.previousElementSibling;
      const clamped = box.classList.toggle('clamped');
      btn.setAttribute('aria-expanded', String(!clamped));
      btn.textContent = clamped
        ? '▸ show all (' + box.textContent.split('\n').length + ' lines)'
        : '▾ show less';
      redraw();
    });
  }
  const notes = shapeNotes();
  if (notes) container.appendChild(notes);
}


/* ---- Shapes: one plot per block, all on one scale ---- */

/* The chosen axes persist across runs, so re-running after an edit does not
   throw away the pair you were looking at. */
let shapeX = '', shapeY = '';

/* Which blocks have their region open, by label, so a re-render restores them. */
const shapeOpen = new Set();

/* Every block of every run, as { label, perRun: [{ label, polys, dropped }] }.
   One entry per disjunct, because a powerset or value-partitioning domain holds
   several regions at once and drawing their union as one shape would claim a
   precision the domain does not have. */
function shapeData(runs, x, y) {
  const order = blockOrder(runs);
  return order.map(label => ({
    label,
    perRun: runs.map(run => {
      const blk = findJsonBlock(run, label);
      const dropped = { ne: 0, gaveUp: false };
      if (!blk) return { label: run.label, polys: null, dropped, kind: 'missing' };
      const iv = blk.invariant || {};
      if (iv.kind === 'true') return { label: run.label, polys: 'all', dropped, kind: 'true' };
      if (iv.kind === 'false') return { label: run.label, polys: [], dropped, kind: 'false' };
      const polys = [];
      for (const dj of (iv.disjuncts || [])) {
        const cons = dj.map(CrabGeom.fromJson).filter(Boolean);
        const pr = CrabGeom.project(cons, x, y);
        dropped.ne += pr.dropped.ne;
        dropped.gaveUp = dropped.gaveUp || pr.dropped.gaveUp;
        const box = CrabGeom.box(pr.cons, x, y);
        const poly = CrabGeom.polygon(pr.cons, x, y, box, dropped);
        if (poly.length) polys.push({ poly, box });
      }
      return { label: run.label, polys, dropped, kind: 'disj' };
    }),
  }));
}

function findJsonBlock(run, label) {
  for (const cfg of (run.json?.cfgs || []))
    for (const b of (cfg.blocks || [])) if (b.label === label) return b;
  return null;
}

/* Blocks in the order the graph lays them out, so the plots read entry to exit
   rather than in whatever order the document happens to list them. */
function blockOrder(runs) {
  const seen = [];
  if (lastGraphs) {
    for (const { g } of lastGraphs) {
      const { layers } = layoutGraph(g);
      for (const lyr of layers) for (const id of lyr) {
        const n = g.blocks[id].name;
        if (!seen.includes(n)) seen.push(n);
      }
    }
  }
  for (const run of runs)
    for (const cfg of (run.json?.cfgs || []))
      for (const b of (cfg.blocks || [])) if (!seen.includes(b.label)) seen.push(b.label);
  return seen;
}

/* Variables that actually appear in some invariant, which is what can be
   plotted -- a variable the domain says nothing about has no region. */
function shapeVars(runs) {
  const vs = new Set();
  for (const run of runs)
    for (const cfg of (run.json?.cfgs || []))
      for (const b of (cfg.blocks || []))
        for (const dj of (b.invariant?.disjuncts || []))
          for (const c of dj)
            for (const [, v] of (c.terms || [])) vs.add(v);
  return [...vs].sort();
}

/* One view box for every plot. Comparing block to block is the point of showing
   them side by side, and a per-plot scale would make equal regions look
   different and different ones look the same. */
function shapeView(data) {
  let lo = Infinity, hi = -Infinity, loY = Infinity, hiY = -Infinity;
  // Which way regions run off, not merely whether they do. A region unbounded
  // above has no finite extent to measure there, so the view has to be grown
  // in that direction on purpose -- sizing it from the finite part alone
  // collapses the axis and shows a sliver of a region that fills the plane.
  const off = { xhi: false, xlo: false, yhi: false, ylo: false };
  for (const blk of data)
    for (const r of blk.perRun) {
      if (!Array.isArray(r.polys)) continue;
      for (const { poly, box } of r.polys)
        for (const [px, py] of poly) {
          // A vertex sitting on the clip box is the region running off, not a
          // real corner: it must not stretch the view to the clip box's size.
          let onEdge = false;
          if (px >= box.hi - 1e-6) { off.xhi = true; onEdge = true; }
          if (px <= box.lo + 1e-6) { off.xlo = true; onEdge = true; }
          if (py >= box.hi - 1e-6) { off.yhi = true; onEdge = true; }
          if (py <= box.lo + 1e-6) { off.ylo = true; onEdge = true; }
          if (onEdge) continue;
          lo = Math.min(lo, px); hi = Math.max(hi, px);
          loY = Math.min(loY, py); hiY = Math.max(hiY, py);
        }
    }
  if (!isFinite(lo)) { lo = 0; hi = 4; }
  if (!isFinite(loY)) { loY = 0; hiY = 4; }
  const padX = Math.max(1, (hi - lo) * 0.18), padY = Math.max(1, (hiY - loY) * 0.18);
  let x0 = lo - padX, x1 = hi + padX, y0 = loY - padY, y1 = hiY + padY;
  // Grow the sides the regions leave through, so the shape visibly reaches the
  // edge and the note about continuing has something to describe.
  const reach = Math.max(4, Math.max(x1 - x0, y1 - y0) * 0.6);
  if (off.xhi) x1 += reach;
  if (off.xlo) x0 -= reach;
  if (off.yhi) y1 += reach;
  if (off.ylo) y0 -= reach;
  const unbounded = off.xhi || off.xlo || off.yhi || off.ylo;
  return { x0, x1, y0, y1, unbounded };
}

/* A tick step that lands on 1, 2 or 5 times a power of ten. */
function niceStep(span, target) {
  const raw = span / Math.max(1, target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw) || 0));
  for (const m of [1, 2, 5, 10]) if (mag * m >= raw) return mag * m;
  return mag * 10;
}

/* Top padding leaves a band above the plot for the y variable's name, so it
   cannot sit on top of the topmost tick label. */
const SH_W = 240, SH_H = 196, SH_PAD = { l: 34, r: 8, t: 18, b: 26 };

function shapePlot(blk, view, x, y) {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'sh-plot');
  svg.setAttribute('width', SH_W);
  svg.setAttribute('height', SH_H);
  const iw = SH_W - SH_PAD.l - SH_PAD.r, ih = SH_H - SH_PAD.t - SH_PAD.b;
  const sx = v => SH_PAD.l + (v - view.x0) / (view.x1 - view.x0) * iw;
  const sy = v => SH_PAD.t + ih - (v - view.y0) / (view.y1 - view.y0) * ih;
  const add = (tag, attrs, cls) => {
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (cls) el.setAttribute('class', cls);
    svg.appendChild(el);
    return el;
  };

  // Grid and ticks, recessive.
  const stepX = niceStep(view.x1 - view.x0, 4), stepY = niceStep(view.y1 - view.y0, 4);
  for (let v = Math.ceil(view.x0 / stepX) * stepX; v <= view.x1; v += stepX) {
    add('line', { x1: sx(v), y1: SH_PAD.t, x2: sx(v), y2: SH_PAD.t + ih }, 'sh-grid');
    const t = add('text', { x: sx(v), y: SH_H - 14, 'text-anchor': 'middle' }, 'sh-tick');
    t.textContent = String(Math.round(v * 100) / 100);
  }
  for (let v = Math.ceil(view.y0 / stepY) * stepY; v <= view.y1; v += stepY) {
    add('line', { x1: SH_PAD.l, y1: sy(v), x2: SH_PAD.l + iw, y2: sy(v) }, 'sh-grid');
    const t = add('text', { x: SH_PAD.l - 4, y: sy(v) + 3, 'text-anchor': 'end' }, 'sh-tick');
    t.textContent = String(Math.round(v * 100) / 100);
  }
  // The axes themselves, where zero is in view.
  if (view.x0 <= 0 && view.x1 >= 0)
    add('line', { x1: sx(0), y1: SH_PAD.t, x2: sx(0), y2: SH_PAD.t + ih }, 'sh-axis');
  if (view.y0 <= 0 && view.y1 >= 0)
    add('line', { x1: SH_PAD.l, y1: sy(0), x2: SH_PAD.l + iw, y2: sy(0) }, 'sh-axis');

  // Regions are clipped to the plot rect: they are cut to a box far wider than
  // the view, so an unbounded one would otherwise paint over the tick labels on
  // its way out.
  const clipId = 'shclip' + (shapePlot.n = (shapePlot.n || 0) + 1);
  const defs = document.createElementNS(SVGNS, 'defs');
  const cp = document.createElementNS(SVGNS, 'clipPath');
  cp.setAttribute('id', clipId);
  const cr = document.createElementNS(SVGNS, 'rect');
  for (const [k, v] of Object.entries({ x: SH_PAD.l, y: SH_PAD.t, width: iw, height: ih }))
    cr.setAttribute(k, v);
  cp.appendChild(cr); defs.appendChild(cp); svg.appendChild(defs);
  const layer = document.createElementNS(SVGNS, 'g');
  layer.setAttribute('clip-path', `url(#${clipId})`);
  svg.appendChild(layer);
  const addIn = (tag, attrs) => {
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    layer.appendChild(el);
    return el;
  };

  // Two domains overlap, so both are translucent and the second is outlined
  // dashed -- which of them is which never rests on colour alone.
  blk.perRun.forEach((r, i) => {
    const col = `var(--series-${i + 1})`;
    if (r.polys === 'all') {
      addIn('rect', { x: SH_PAD.l, y: SH_PAD.t, width: iw, height: ih,
                      fill: col, 'fill-opacity': 0.12, stroke: col,
                      'stroke-dasharray': '2 3', 'stroke-opacity': 0.5 });
      return;
    }
    if (!Array.isArray(r.polys)) return;
    for (const { poly } of r.polys) {
      const pts = poly.map(p => `${sx(p[0])},${sy(p[1])}`).join(' ');
      if (poly.length === 1) {
        addIn('circle', { cx: sx(poly[0][0]), cy: sy(poly[0][1]), r: 3.5, fill: col });
      } else if (poly.length === 2) {
        // A region pinned to a line by an equality: no area to fill.
        addIn('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 2,
                            'stroke-dasharray': i ? '5 3' : 'none' });
      } else {
        addIn('polygon', { points: pts, fill: col, 'fill-opacity': 0.22,
                           stroke: col, 'stroke-width': 2,
                           'stroke-dasharray': i ? '5 3' : 'none' });
      }
    }
  });

  // Axis names, once per plot, so a plot read on its own still says what it is.
  // An arrow so the name reads as the axis it labels rather than as a stray
  // value sitting in the corner.
  const xl = add('text', { x: SH_PAD.l + iw, y: SH_H - 3, 'text-anchor': 'end' }, 'sh-vlabel');
  xl.textContent = x + ' →';
  const yl = add('text', { x: 3, y: 11 }, 'sh-vlabel');
  yl.textContent = '↑ ' + y;
  return svg;
}

/* Everything the graph needs to draw a region beside a block: the projected
   regions per block, the one scale they all share, and the caveats that go
   under the graph. Null when nothing can be drawn at all, which is what hides
   the axis pickers and the per-block toggles. */
let shapeCtx = null;

function buildShapeCtx(runs) {
  if (!runs || !runs.length) return null;
  const withDoc = runs.filter(r => r.json);
  if (!withDoc.length) return null;              // no constraint system anywhere
  const vars = shapeVars(runs);
  if (vars.length < 2) return null;              // a region needs two variables
  if (!vars.includes(shapeX)) shapeX = vars[0];
  if (!vars.includes(shapeY) || shapeY === shapeX) shapeY = vars.find(v => v !== shapeX);
  const data = shapeData(runs, shapeX, shapeY);
  const view = shapeView(data);
  const byLabel = new Map(data.map(b => [b.label, b]));
  const flags = { ne: false, gaveUp: false, bottom: false,
                  noDoc: runs.filter(r => !r.json) };
  for (const blk of data)
    for (const r of blk.perRun) {
      flags.ne = flags.ne || r.dropped.ne > 0;
      flags.gaveUp = flags.gaveUp || r.dropped.gaveUp;
      if (r.kind === 'false') flags.bottom = true;
    }
  return { vars, data, byLabel, view, flags, runs, x: shapeX, y: shapeY };
}

/* The axis pickers live in the tab bar: they apply to every block at once, so
   repeating them per card would suggest they do not. */
function renderShapePickers() {
  const host = $('sh-pick');
  host.innerHTML = '';
  if (!shapeCtx) { host.hidden = true; return; }
  host.hidden = view !== 'graph';
  const mkSel = (label, cur, onPick) => {
    const wrap = document.createElement('label');
    // Named for the axis, not "x" and "y": programs have variables called x and
    // y, and a picker labelled "x" holding a variable called x reads as nonsense.
    wrap.textContent = label + ' ';
    const sel = document.createElement('select');
    for (const v of shapeCtx.vars) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v; o.selected = v === cur;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => {
      onPick(sel.value);
      shapeCtx = buildShapeCtx(lastRuns);
      renderShapePickers();
      renderGraph($('graph'), lastGraphs);
    });
    wrap.appendChild(sel);
    return wrap;
  };
  host.appendChild(mkSel('region:', shapeCtx.x, v => {
    shapeX = v; if (shapeY === v) shapeY = shapeCtx.vars.find(u => u !== v);
  }));
  host.appendChild(mkSel('vs', shapeCtx.y, v => {
    shapeY = v; if (shapeX === v) shapeX = shapeCtx.vars.find(u => u !== v);
  }));
}

/* The caveats, under the graph rather than on every card. */
function shapeNotes() {
  if (!shapeCtx) return null;
  const f = shapeCtx.flags, notes = [];
  notes.push('A region is the block’s invariant projected onto ' + shapeCtx.x +
             ' and ' + shapeCtx.y + ', with the other variables eliminated. ' +
             'Every region shares one scale, so they can be compared.');
  if (shapeCtx.view.unbounded)
    notes.push('A region that reaches a plot edge continues beyond it — the ' +
               'invariant does not bound it in that direction.');
  if (f.noDoc.length)
    notes.push('<strong>' + f.noDoc.map(r => r.label).join(', ') +
               ' has no region:</strong> it provides no constraint system, so ' +
               'there is nothing to project.');
  if (f.ne)
    notes.push('<strong>Some ≠ constraints were dropped.</strong> A disequation ' +
               'excludes a line, which a convex region cannot express, so the shape ' +
               'drawn is a superset of the real one by a set of zero area.');
  if (f.gaveUp)
    notes.push('<strong>Elimination was cut short</strong> on at least one block, so ' +
               'its region may be larger than the invariant allows.');
  notes.push('Variables are integers; a region is the real relaxation, so not ' +
             'every point in it is a reachable state.');
  const nd = document.createElement('div');
  nd.className = 'sh-note';
  nd.innerHTML = notes.join('<br>');
  return nd;
}

/* The expanded region for one block, built on demand. */
function shapePanel(label) {
  const blk = shapeCtx.byLabel.get(label);
  const wrap = document.createElement('div');
  if (!blk) return wrap;
  wrap.appendChild(shapePlot(blk, shapeCtx.view, shapeCtx.x, shapeCtx.y));
  if (blk.perRun.every(r => r.kind === 'false')) {
    const n = document.createElement('div');
    n.className = 'sh-note';
    n.style.margin = '2px 0 0';
    n.textContent = '⊥ unreachable';
    wrap.appendChild(n);
  }
  // With two domains the plot needs to say which is which, and it is read on
  // its own rather than next to a shared legend.
  if (shapeCtx.runs.length > 1) {
    const leg = document.createElement('div');
    leg.className = 'sh-legend';
    shapeCtx.runs.forEach((r, i) => {
      const s = document.createElement('span');
      const k = document.createElement('span');
      k.className = 'sh-key';
      k.style.background = `var(--series-${i + 1})`;
      s.appendChild(k);
      s.appendChild(document.createTextNode(r.label + (i ? ' (dashed)' : ' (solid)')));
      leg.appendChild(s);
    });
    wrap.appendChild(leg);
  }
  return wrap;
}

/* ---- Output views: keep the last run's text + merged graphs, switch between them ---- */
let lastText = '', lastGraphs = null, lastRuns = null;

function readDots(M, stdout) {
  const dots = [], seen = new Set();
  const re = /Writing '([^']+\.crab\.dot)'/g; let m;
  while (m = re.exec(stdout)) {
    const f = m[1]; if (seen.has(f)) continue; seen.add(f);
    try { dots.push({ name: f.replace(/\.crab\.dot$/, ''), dot: M.FS.readFile('/' + f, { encoding: 'utf8' }) }); }
    catch (e) {}
  }
  return dots;
}

/* The graph is what the playground is for -- the blocks with their invariants
   and the assertion outcomes on them -- so it opens on that; the text pane is
   the full analyzer output, for when the graph is not enough. */
let view = 'graph';
function setView(v) {
  view = v;
  for (const t of ['text', 'graph'])
    $('tab-' + t).classList.toggle('active', v === t);
  $('out').hidden = v !== 'text';
  $('graph').hidden = v !== 'graph';
  $('sh-pick').hidden = v !== 'graph' || !shapeCtx;
  if (v === 'graph') renderGraph($('graph'), lastGraphs);
}
$('tab-text').addEventListener('click', () => setView('text'));
$('tab-graph').addEventListener('click', () => setView('graph'));

/* Run the analyzer once for a single domain, returning its text + dot files. */
async function analyzeWith(domain) {
  let buf = '';
  // Fresh instance each run so stdout, the in-memory FS and analysis state
  // don't leak between runs.
  // Apron's octagon manager prints a harmless FPU-rounding warning at startup
  // (wasm has no fesetround); with exact-rational (MPQ) domains it's cosmetic.
  const isFpuNoise = t => /fpu rounding mode|cannot change the FPU/i.test(t);
  const M = await Crabber({
    print: t => buf += t + '\n',
    printErr: t => { if (!isFpuNoise(t)) buf += t + '\n'; },
  });
  const args = ['/prog.crabir', '-d', domain];
  const extra = $('flags').value.trim();
  if (extra) args.push(...extra.split(/\s+/));
  if ($('inv').checked) args.push('--print-invariants');
  args.push('--print-invariants-to-dot');          // always emit dot so the Graph tab is ready
  // The dot is what the graph reads, but it carries invariants as text. The
  // Shapes tab needs the coefficients as numbers, which is what the JSON
  // document has, so both are asked for and each view reads the one that suits
  // it. One analysis, two serializations -- not two runs.
  args.push('--print-invariants-to-json', '/inv.json');
  try {
    M.FS.writeFile('/prog.crabir', src.value);
    M.callMain(args);
  } catch (e) {
    buf += '\n[aborted] ' + String(e).split('\n')[0] + '\n';
  }
  // dis-int has no constraint system, so it aborts the JSON export; the graph
  // and text views still work, and the Shapes tab reports what it cannot draw.
  let json = null;
  try { json = JSON.parse(M.FS.readFile('/inv.json', { encoding: 'utf8' })); }
  catch (e) {}
  // Hide the "Writing 'x.crab.dot'..." lines (an artifact of the graph) and
  // tidy the invariant pairs the same way the graph does.
  const text = simplifyPairs(buf.replace(/^Writing '[^']+\.crab\.dot'\.\.\.\n?/gm, ''));
  return { domain, label: DOMAIN_LABEL[domain] || domain, text,
           dots: readDots(M, buf), json };
}

/* ---- Run: analyze the primary domain, and a second one if comparing ---- */
const runBtn = $('run');
runBtn.addEventListener('click', async () => {
  $('out').textContent = 'Running…';
  if (view === 'graph') $('graph').textContent = 'Running…';
  const d1 = $('domain').value, d2 = $('domain2').value;
  const domains = (d2 && d2 !== d1) ? [d1, d2] : [d1];
  const runs = [];
  for (const d of domains) runs.push(await analyzeWith(d));
  lastText = runs.length === 1 ? runs[0].text
    : runs.map(r => `##### domain: ${r.label} (${r.domain}) #####\n` + r.text).join('\n');
  $('out').textContent = lastText;
  lastRuns = runs;
  // The graph first: the regions are ordered and labelled off it.
  lastGraphs = buildUnifiedGraphs(runs);
  shapeCtx = buildShapeCtx(runs);
  renderShapePickers();
  if (view === 'graph') renderGraph($('graph'), lastGraphs);
});

/* ---- Resizable divider between the editor and the output pane ---- */
(function () {
  const mainEl = document.querySelector('main'), gutter = $('gutter');
  const MIN = 0.12, MAX = 0.88;                       // keep both panes usable
  const vertQuery = window.matchMedia('(max-width: 720px)');
  const isVert = () => vertQuery.matches;             // narrow screens stack panes
  const clamp = f => Math.min(MAX, Math.max(MIN, f));
  let split = { x: 0.5, y: 0.5 };
  try { Object.assign(split, JSON.parse(localStorage.getItem('crabber.split') || '{}')); } catch {}

  function apply() {
    // Percentage (not px) so the split holds its proportion when the window resizes.
    mainEl.style.setProperty('--split-x', (split.x * 100) + '%');
    mainEl.style.setProperty('--split-y', (split.y * 100) + '%');
  }
  function set(frac) {
    frac = clamp(frac);
    if (isVert()) split.y = frac; else split.x = frac;
    apply();
    try { localStorage.setItem('crabber.split', JSON.stringify(split)); } catch {}
  }
  apply();

  function fracFromEvent(e) {
    const r = mainEl.getBoundingClientRect();
    return isVert() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  }
  gutter.addEventListener('pointerdown', e => {
    e.preventDefault();
    gutter.setPointerCapture(e.pointerId);
    gutter.classList.add('dragging');
    document.body.classList.add('gutter-dragging');
    document.body.classList.toggle('vert', isVert());
    const move = ev => set(fracFromEvent(ev));
    const up = ev => {
      gutter.releasePointerCapture(e.pointerId);
      gutter.classList.remove('dragging');
      document.body.classList.remove('gutter-dragging', 'vert');
      gutter.removeEventListener('pointermove', move);
      gutter.removeEventListener('pointerup', up);
    };
    gutter.addEventListener('pointermove', move);
    gutter.addEventListener('pointerup', up);
  });
  // Keyboard: arrow keys nudge the focused divider.
  gutter.addEventListener('keydown', e => {
    const cur = isVert() ? split.y : split.x, step = 0.02;
    const dec = isVert() ? 'ArrowUp' : 'ArrowLeft', inc = isVert() ? 'ArrowDown' : 'ArrowRight';
    if (e.key === dec) { set(cur - step); e.preventDefault(); }
    else if (e.key === inc) { set(cur + step); e.preventDefault(); }
  });
})();

/* ---- Initialise ---- */
loadInitialState();
setView(view);                                     // paints the graph placeholder
runBtn.textContent = 'Run';
runBtn.disabled = false;
</script>
</body>
</html>
